[pytest]
# Collection is pinned to tests/ so a scratch script left at the repository
# root cannot be mistaken for a suite. test2.py and test_historic.py were
# ad-hoc debugging files that matched test_*.py, and a bare `pytest` ran
# forty seconds of live grid analysis at import time before collecting a
# single real test.
testpaths = tests
markers =
    live: needs the locally built production databases; run with -m live
