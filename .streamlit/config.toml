# Streamlit's own theme, which controls the widget chrome CSS cannot reach:
# selectbox and slider internals, the dataframe grid, expander headers and
# their focus rings. Streamlit's default base is light, so without this the
# widgets would render pale on the dark page theme.py paints.
#
# Values mirror the AFL palette in theme.py (its `default_mode`). Change
# them together, or the widgets drift away from the page.
[theme]
base = "dark"
primaryColor = "#E31837"          # accent
backgroundColor = "#071B2B"       # board
secondaryBackgroundColor = "#0C2A42"  # panel
textColor = "#F7F9FC"             # chalk

[browser]
gatherUsageStats = false
